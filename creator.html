<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Creator studio - EmberFans</title><link rel="stylesheet" href="styles.css" /><style>body{min-height:100vh;padding:32px;background:#090a10}.studio{max-width:860px;margin:auto}.studio-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.studio-logo{width:68px;height:auto}.studio h1{margin:0;font-size:28px}.studio p{color:#a4a5b0;font-size:12px}.studio-card{background:#171925;border:1px solid #323442;border-radius:14px;padding:26px}.studio-form{display:grid;gap:16px}.studio-form label{display:grid;gap:7px;font-size:11px;font-weight:700}.studio-form input,.studio-form textarea,.studio-form select{border:1px solid #393b4b;border-radius:8px;background:#10111a;color:#fff;padding:11px;font:12px Manrope}.studio-form textarea{min-height:95px;resize:vertical}.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.studio-message{min-height:18px;color:#ffaaa2;font-size:11px}.studio-status{background:#20212c;border-radius:8px;padding:10px;font-size:11px;color:#c8c8d1}@media(max-width:600px){body{padding:20px}.studio-grid{grid-template-columns:1fr}.studio-head{align-items:flex-start;gap:14px}.studio-head h1{font-size:23px}}</style></head><body><main class="studio"><header class="studio-head"><a href="index.html"><img class="studio-logo" src="assets/emberfans-logo.png" alt="EmberFans" /></a><div><h1>Creator studio</h1><p id="accountStatus">Checking your account...</p></div><a class="secondary-button" href="index.html">Back to community</a></header><section class="studio-card" id="studioCard" hidden><h2>Publish content</h2><p>Create the content record, set its member access, then upload the protected media file.</p><form class="studio-form" id="publishForm"><label>Title<input id="title" maxlength="120" required /></label><label>Description<textarea id="summary" maxlength="1000"></textarea></label><div class="studio-grid"><label>Content type<select id="kind" required><option value="sfw_photo">SFW photo</option><option value="nsfw_photo">NSFW photo</option><option value="video">Video</option><option value="live_event">Live event</option></select></label><label>Viewer access<select id="accessType" required><option value="free">Free members</option><option value="subscriber">Subscribers only</option><option value="purchase">Individual unlock</option></select></label></div><label>Media file <input id="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" /></label><p class="studio-status">Accepted files: JPEG, PNG, WebP, MP4, or WebM. Maximum 100 MB. Uploaded media is served only through signed-in access checks.</p><button class="primary-button" type="submit">Publish content <span>&#8594;</span></button></form><p class="studio-message" id="studioMessage" role="status"></p></section></main><script src="creator.js"></script></body></html>
