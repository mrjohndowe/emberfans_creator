<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Communities - EmberFans</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-view{display:block;padding:28px 32px}.gallery-hero{padding:24px;border:1px solid #384253;border-radius:12px;background:linear-gradient(125deg,#1e2633,#29394b);margin-bottom:18px}.gallery-hero span{color:#a7cbff;font:800 9px DM Mono,monospace;letter-spacing:1.4px}.gallery-hero h2{margin:7px 0 5px;font-size:23px}.gallery-hero p{margin:0;color:#c6d0de;font-size:12px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.gallery-card{overflow:hidden;border:1px solid #303644;border-radius:10px;background:#171a23}.gallery-card:hover{border-color:#647593;transform:translateY(-1px)}.gallery-visual{position:relative;display:grid;place-items:center;aspect-ratio:1.15;background:linear-gradient(135deg,#34455d,#202837);overflow:hidden}.gallery-visual.nsfw_photo{background:linear-gradient(135deg,#74425e,#2a2033)}.gallery-visual.video{background:linear-gradient(135deg,#3b3c67,#141827)}.gallery-visual span{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#12151ecc;color:#e4ecff;font-size:18px}.gallery-visual img,.gallery-visual video{position:absolute;width:100%;height:100%;object-fit:cover}.gallery-card>div:last-child{display:grid;gap:4px;padding:11px}.gallery-card strong{overflow:hidden;color:#f2f4fb;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.gallery-card small{color:#9ca6b7;font-size:10px}.gallery-empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#aeb8c7}.gallery-empty>div{font-size:34px;color:#a7cbff}.gallery-empty h2{margin:7px 0;font-size:16px}.gallery-empty p{font-size:11px}@media(max-width:720px){.gallery-view{padding:20px 16px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    :root{--side:#11131c;--line:#2a2d3a;--soft:#a3a7b8}body{margin:0;min-height:100vh;background:#090a10;color:#f5f3f1;font-family:Manrope,Arial,sans-serif}.community-app{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:100vh}.community-side{min-height:100vh;overflow-y:auto;padding:22px 12px 124px;background:var(--side);border-right:1px solid var(--line)}.community-logo{display:block;width:58px;height:auto;margin:0 12px 23px}.community-side h2{display:flex;justify-content:space-between;margin:25px 12px 7px;color:#8f95aa;font:800 10px Manrope;letter-spacing:1px}.community-list,.channel-list{display:grid;gap:2px}.community-list button,.channel-list button{display:flex;width:100%;align-items:center;border:0;border-radius:6px;padding:8px 11px;background:transparent;color:#aeb3c2;text-align:left;font:600 12px Manrope;cursor:pointer}.community-list button:hover,.community-list button.active,.channel-list button:hover,.channel-list button.active{background:#292c38;color:#fff}.channel-list section{margin:12px 0 4px}.channel-list section h2{margin-top:0;cursor:context-menu;user-select:none}.channel-list .category-add{width:23px;height:23px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:#b2b7c7;font-size:18px;font-weight:400;line-height:1;cursor:pointer}.channel-list .category-add:hover{background:#292c38;color:#fff}.channel-list button{gap:7px;padding-left:12px}.category-drop-zone{min-height:30px;border-radius:6px}.side-action{width:calc(100% - 24px);margin:12px;border:0;border-radius:7px;padding:10px;background:#f5e7df;color:#3c292a;font:800 11px Manrope;cursor:pointer}.new-channel{display:none}.community-main{display:grid;min-width:0;grid-template-rows:94px minmax(0,1fr) auto;background:#090a10}.community-head{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#0b0c13}.community-head h1{margin:2px 0;font-size:20px;letter-spacing:-.4px}.community-head p{margin:0;color:var(--soft);font-size:10px}#channelType{color:#ff9c92;font:800 9px DM Mono,monospace;letter-spacing:1.2px}.message-list{display:grid;align-content:start;gap:17px;overflow-y:auto;padding:28px 32px}.community-message{display:grid;grid-template-columns:35px minmax(0,1fr);gap:10px}.community-message .avatar{display:grid;width:35px;height:35px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#fd745a,#b9376e);color:white;font-size:10px;font-weight:800}.community-message p{margin:0;color:#dbdbe3;font-size:12px;line-height:1.65}.community-message strong{color:#fff;font-size:12px}.community-message time{margin-left:7px;color:#7f8495;font-size:9px}.empty{align-self:center;justify-self:center;max-width:390px;padding:60px 25px;color:#a7acbc;text-align:center;font-size:12px;line-height:1.8}.message-form{display:flex;gap:10px;padding:16px 30px;border-top:1px solid var(--line);background:#0b0c13}.message-form input{min-width:0;flex:1;border:1px solid #353846;border-radius:8px;padding:12px 14px;background:#191b25;color:#fff;outline:none;font:12px Manrope}.message-form button{border:0;border-radius:8px;padding:0 17px;background:#ff7161;color:#fff;font:800 11px Manrope;cursor:pointer}.secondary-button{border:1px solid #414452;border-radius:7px;padding:9px 12px;background:#242633;color:#efedf2;text-decoration:none;font:700 10px Manrope}#voiceDock{position:fixed;z-index:15;left:12px;bottom:12px;width:260px;padding:13px;border:1px solid #343642;border-radius:9px;background:#1d202b;box-shadow:0 10px 28px #0008}@media(max-width:720px){.community-app{grid-template-columns:1fr}.community-side{display:none}.community-head{padding:0 16px}.message-list{padding:20px 16px}.message-form{padding:12px 16px}}
    .forum-view{display:block;padding:28px 32px}.forum-hero{padding:24px;border:1px solid #3a3d4e;border-radius:12px;background:linear-gradient(125deg,#202238,#312340);margin-bottom:18px}.forum-hero span{color:#ffae9d;font:800 9px DM Mono,monospace;letter-spacing:1.4px}.forum-hero h2{margin:7px 0 5px;font-size:23px}.forum-hero p{margin:0;color:#c3c5d3;font-size:12px}.forum-topic-list{border:1px solid #303341;border-radius:10px;overflow:hidden;background:#12141d}.forum-list-heading{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #303341;color:#d9dce6;font-size:11px}.forum-list-heading span{color:#949aac}.forum-post{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:12px;padding:16px;border-bottom:1px solid #2b2e3b;background:#181a24}.forum-post:last-child{border:0}.forum-post:hover{background:#1e202c}.forum-post-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#323653;color:#cbd5ff;font-size:17px}.forum-post h3{margin:0 0 5px;color:#fff;font-size:14px}.forum-post p{margin:0 0 8px;color:#c0c3d0;font-size:12px;line-height:1.55}.forum-post small{color:#9298aa;font-size:10px}.forum-post small b{color:#dce0ea}.forum-replies{align-self:start;border:1px solid #414555;border-radius:12px;padding:4px 7px;color:#aeb4c7;font-size:9px}.forum-empty{text-align:center;padding:50px 20px;color:#aeb3c2}.forum-empty>div{font-size:31px;color:#cbd5ff}.forum-empty h2{margin:7px 0;font-size:16px}.forum-empty p{font-size:11px}@media(max-width:720px){.forum-view{padding:20px 16px}.forum-post{grid-template-columns:32px minmax(0,1fr)}.forum-replies{display:none}}
  </style>
  <style>
    .admin-cog{display:none;width:calc(100% - 24px);margin:8px 12px 16px;padding:9px 10px;border:1px solid #323542;border-radius:7px;background:#1a1c27;color:#d9dce6;text-align:left;font:700 10px Manrope;cursor:pointer}.admin-cog:hover{border-color:#707687;background:#242733}.admin-cog span{float:right;font-size:15px;line-height:10px}.settings-modal{display:none;position:fixed;z-index:40;inset:0;place-items:center;background:#08090dbb}.settings-card{width:min(760px,calc(100% - 28px));min-height:390px;display:grid;grid-template-columns:190px minmax(0,1fr);overflow:hidden;border:1px solid #414452;border-radius:11px;background:#1b1d27;box-shadow:0 25px 80px #0009}.settings-nav{padding:18px 10px;background:#151721;border-right:1px solid #343744}.settings-nav strong{display:block;padding:0 9px 15px;font-size:13px}.settings-nav button{width:100%;border:0;border-radius:6px;padding:10px;background:transparent;color:#afb4c3;text-align:left;font:700 11px Manrope;cursor:pointer}.settings-nav button:hover,.settings-nav button.active{background:#2a2d3a;color:#fff}.settings-main{padding:25px;overflow:auto}.settings-main h2{margin:0 0 5px;font-size:20px}.settings-main p{color:#aeb3c2;font-size:11px;line-height:1.6}.audit-entry{padding:12px 0;border-bottom:1px solid #343744}.audit-entry:last-child{border:0}.audit-entry strong,.audit-entry small{display:block}.audit-entry strong{font-size:12px}.audit-entry small{margin-top:3px;color:#9ca2b4;font-size:10px}.settings-close{float:right;border:0;background:transparent;color:#bcc1cf;font-size:21px;cursor:pointer}
  </style>
</head>
<body>
  <main class="community-app">
    <aside class="community-side">
      <a href="index.html"><img class="community-logo" src="assets/emberfans-logo.png" alt="EmberFans"></a>
      <h2>YOUR COMMUNITIES</h2>
      <div id="communityList" class="community-list"></div>
      <div id="communityAdmin"></div>
      <div id="channelList" class="channel-list"></div>
    </aside>
    <section class="community-main">
      <header class="community-head"><div><span id="channelType">COMMUNITY</span><h1 id="channelTitle">Communities</h1><p id="channelSubtitle">Choose a community to start chatting.</p></div><a class="secondary-button" href="index.html">Dashboard</a></header>
      <div class="message-list" id="messageList"><p class="empty">Loading your communities...</p></div>
      <form class="message-form" id="messageForm" hidden><input id="messageInput" maxlength="2000" placeholder="Message this channel" autocomplete="off"><button>Send</button></form>
    </section>
  </main>
  <script src="community.js"></script>
</body>
</html>
