<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Communities - EmberFans</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--side:#11131c;--line:#2a2d3a;--soft:#a3a7b8}body{margin:0;min-height:100vh;background:#090a10;color:#f5f3f1;font-family:Manrope,Arial,sans-serif}.community-app{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:100vh}.community-side{min-height:100vh;overflow-y:auto;padding:22px 12px 124px;background:var(--side);border-right:1px solid var(--line)}.community-logo{display:block;width:58px;height:auto;margin:0 12px 23px}.community-side h2{display:flex;justify-content:space-between;margin:25px 12px 7px;color:#8f95aa;font:800 10px Manrope;letter-spacing:1px}.community-list,.channel-list{display:grid;gap:2px}.community-list button,.channel-list button{display:flex;width:100%;align-items:center;border:0;border-radius:6px;padding:8px 11px;background:transparent;color:#aeb3c2;text-align:left;font:600 12px Manrope;cursor:pointer}.community-list button:hover,.community-list button.active,.channel-list button:hover,.channel-list button.active{background:#292c38;color:#fff}.channel-list section{margin:12px 0 4px}.channel-list section h2{margin-top:0;cursor:context-menu;user-select:none}.channel-list .category-add{width:23px;height:23px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:#b2b7c7;font-size:18px;font-weight:400;line-height:1;cursor:pointer}.channel-list .category-add:hover{background:#292c38;color:#fff}.channel-list button{gap:7px;padding-left:12px}.category-drop-zone{min-height:30px;border-radius:6px}.side-action{width:calc(100% - 24px);margin:12px;border:0;border-radius:7px;padding:10px;background:#f5e7df;color:#3c292a;font:800 11px Manrope;cursor:pointer}.new-channel{display:none}.community-main{display:grid;min-width:0;grid-template-rows:94px minmax(0,1fr) auto;background:#090a10}.community-head{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#0b0c13}.community-head h1{margin:2px 0;font-size:20px;letter-spacing:-.4px}.community-head p{margin:0;color:var(--soft);font-size:10px}#channelType{color:#ff9c92;font:800 9px DM Mono,monospace;letter-spacing:1.2px}.message-list{display:grid;align-content:start;gap:17px;overflow-y:auto;padding:28px 32px}.community-message{display:grid;grid-template-columns:35px minmax(0,1fr);gap:10px}.community-message .avatar{display:grid;width:35px;height:35px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#fd745a,#b9376e);color:white;font-size:10px;font-weight:800}.community-message p{margin:0;color:#dbdbe3;font-size:12px;line-height:1.65}.community-message strong{color:#fff;font-size:12px}.community-message time{margin-left:7px;color:#7f8495;font-size:9px}.empty{align-self:center;justify-self:center;max-width:390px;padding:60px 25px;color:#a7acbc;text-align:center;font-size:12px;line-height:1.8}.message-form{display:flex;gap:10px;padding:16px 30px;border-top:1px solid var(--line);background:#0b0c13}.message-form input{min-width:0;flex:1;border:1px solid #353846;border-radius:8px;padding:12px 14px;background:#191b25;color:#fff;outline:none;font:12px Manrope}.message-form button{border:0;border-radius:8px;padding:0 17px;background:#ff7161;color:#fff;font:800 11px Manrope;cursor:pointer}.secondary-button{border:1px solid #414452;border-radius:7px;padding:9px 12px;background:#242633;color:#efedf2;text-decoration:none;font:700 10px Manrope}#voiceDock{position:fixed;z-index:15;left:12px;bottom:12px;width:260px;padding:13px;border:1px solid #343642;border-radius:9px;background:#1d202b;box-shadow:0 10px 28px #0008}@media(max-width:720px){.community-app{grid-template-columns:1fr}.community-side{display:none}.community-head{padding:0 16px}.message-list{padding:20px 16px}.message-form{padding:12px 16px}}
  </style>
</head>
<body>
  <main class="community-app">
    <aside class="community-side">
      <a href="index.html"><img class="community-logo" src="assets/emberfans-logo.png" alt="EmberFans"></a>
      <h2>YOUR COMMUNITIES</h2>
      <div id="communityList" class="community-list"></div>
      <div id="channelList" class="channel-list"></div>
    </aside>
    <section class="community-main">
      <header class="community-head"><div><span id="channelType">COMMUNITY</span><h1 id="channelTitle">Communities</h1><p id="channelSubtitle">Choose a community to start chatting.</p></div><a class="secondary-button" href="index.html">Dashboard</a></header>
      <div class="message-list" id="messageList"><p class="empty">Loading your communities...</p></div>
      <form class="message-form" id="messageForm" hidden><input id="messageInput" maxlength="2000" placeholder="Message this channel" autocomplete="off"><button>Send</button></form>
    </section>
  </main>
  <script src="community.js"></script>
</body>
</html>
