    :root{--side:#11131c;--line:#2a2d3a;--soft:#a3a7b8}body{margin:0;min-height:100vh;background:#090a10;color:#f5f3f1;font-family:Manrope,Arial,sans-serif}.community-app{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:100vh}.community-side{min-height:100vh;overflow-y:auto;padding:22px 12px 124px;background:var(--side);border-right:1px solid var(--line)}.community-logo{display:block;width:58px;height:auto;margin:0 12px 23px}.community-side h2{display:flex;justify-content:space-between;margin:25px 12px 7px;color:#8f95aa;font:800 10px Manrope;letter-spacing:1px}.community-list,.channel-list{display:grid;gap:2px}.community-list button,.channel-list button{display:flex;width:100%;align-items:center;border:0;border-radius:6px;padding:8px 11px;background:transparent;color:#aeb3c2;text-align:left;font:600 12px Manrope;cursor:pointer}.community-list button:hover,.community-list button.active,.channel-list button:hover,.channel-list button.active{background:#292c38;color:#fff}.channel-list section{margin:12px 0 4px}.channel-list section h2{margin-top:0;cursor:context-menu;user-select:none}.channel-list .category-add{width:23px;height:23px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:#b2b7c7;font-size:18px;font-weight:400;line-height:1;cursor:pointer}.channel-list .category-add:hover{background:#292c38;color:#fff}.channel-list button{gap:7px;padding-left:12px}.category-drop-zone{min-height:30px;border-radius:6px}.side-action{width:calc(100% - 24px);margin:12px;border:0;border-radius:7px;padding:10px;background:#f5e7df;color:#3c292a;font:800 11px Manrope;cursor:pointer}.new-channel{display:none}.community-main{display:grid;min-width:0;grid-template-rows:94px minmax(0,1fr) auto;background:#090a10}.community-head{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#0b0c13}.community-head h1{margin:2px 0;font-size:20px;letter-spacing:-.4px     .forum-view{display:block;padding:28px 32px}.forum-hero{padding:24px;border:1px solid #3a3d4e;border-radius:12px;background:linear-gradient(125deg,#202238,#312340);margin-bottom:18px}.forum-hero span{color:#ffae9d;font:800 9px DM Mono,monospace;letter-spacing:1.4px}.forum-hero h2{margin:7px 0 5px;font-size:23px}.forum-hero p{margin:0;color:#c3c5d3;font-size:12px}.forum-topic-list{border:1px solid #303341;border-radius:10px;overflow:hidden;background:#12141d}.forum-list-heading{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #303341;color:#d9dce6;font-size:11px}.forum-list-heading span{color:#949aac}.forum-post{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:12px;padding:16px;border-bottom:1px solid #2b2e3b;background:#181a24}.forum-post:last-child{border:0}.forum-post:hover{background:#1e202c}.forum-post-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#323653;color:#cbd5ff;font-size:17px}.forum-post h3{margin:0 0 5px;color:#fff;font-size:14px}.forum-post p{margin:0 0 8px;color:#c0c3d0;font-size:12px;line-height:1.55}.forum-post small{color:#9298aa;font-size:10px}.forum-post small b{color:#dce0ea}.forum-replies{align-self:start;border:1px solid #414555;border-radius:12px;padding:4px 7px;color:#aeb4c7;font-size:9px}.forum-empty{text-align:center;padding:50px 20px;color:#aeb3c2}.forum-empty>div{font-size:31px;color:#cbd5ff}.forum-empty h2{margin:7px 0;font-size:16px}.forum-empty p{font-size:11px}@media(max-width:720px){.forum-view{padding:20px 16px}.forum-post{grid-template-columns:32px minmax(0,1fr)}.forum-replies{display:none}}

  <style>

<body>
  <main class="community-app">
    <aside class="community-side">
      <a href="index.html"><img class="community-logo" src="assets/emberfans-logo.png" alt="EmberFans"></a>
      <h2>YOUR COMMUNITIES</h2>
      <div id="communityList" class="community-list"></div>
      <div id="communityMembership"></div>
      <div id="communityAdmin"></div>
      <div id="channelList" class="channel-list"></div>
    </aside>
    <section class="community-main">
      <header class="community-head"><div><span id="channelType">COMMUNITY</span><h1 id="channelTitle">Communities</h1><p id="channelSubtitle">Choose a community to start chatting.</p></div><a class="secondary-button" href="index.html">Dashboard</a></header>
      <div class="message-list" id="messageList"><p class="empty">Loading your communities...</p></div>
      <form class="message-form" id="messageForm" hidden><input id="messageInput" maxlength="2000" placeholder="Message this channel" autocomplete="off"><button>Send</button></form>
    </section>
  </main>
  <script src="community.js"></script>
