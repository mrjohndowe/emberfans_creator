<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Communities - EmberFans</title><link rel="stylesheet" href="styles.css" /><style>body{min-height:100vh;background:#090a10}.community-app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.community-side{background:#12131c;border-right:1px solid #2b2d3a;padding:22px 14px}.community-logo{width:54px;height:auto;display:block;margin:0 7px 24px}.community-list{display:grid;gap:5px}.community-list button,.channel-list button{border:0;background:transparent;color:#b7b8c4;padding:10px;text-align:left;border-radius:7px;font:600 12px Manrope;cursor:pointer}.community-list button.active,.community-list button:hover,.channel-list button.active,.channel-list button:hover{background:#282a37;color:#fff}.community-side h2{font-size:10px;color:#858794;letter-spacing:1px;margin:21px 8px 8px}.community-main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.community-head{padding:18px 28px;border-bottom:1px solid #2b2d3a;display:flex;align-items:center;justify-content:space-between}.community-head h1{margin:0;font-size:19px}.community-head p{margin:3px 0 0;color:#a0a1ad;font-size:10px}.message-list{padding:24px 28px;display:grid;align-content:start;gap:18px;overflow:auto}.community-message{display:grid;grid-template-columns:34px 1fr;gap:10px}.community-message .avatar{width:34px;height:34px;background:linear-gradient(135deg,#fd745a,#bd346a)}.community-message p{margin:0;color:#d8d7e1;font-size:12px;line-height:1.6}.community-message strong{font-size:12px}.community-message time{font-size:9px;color:#858794;margin-left:7px}.message-form{display:flex;gap:8px;padding:15px 28px;border-top:1px solid #2b2d3a}.message-form input{flex:1;min-width:0;border:1px solid #383a49;background:#171925;color:#fff;padding:11px;border-radius:8px;font:12px Manrope}.message-form button{border:0;background:#ff6859;color:#fff;border-radius:8px;padding:0 15px;font:700 11px Manrope;cursor:pointer}.empty{color:#9d9eaa;text-align:center;padding:60px 20px;font-size:12px;line-height:1.7}.side-action{width:100%;margin-top:15px;background:#f1e6e0;color:#37292a;border:0;border-radius:7px;padding:10px;font:700 11px Manrope;cursor:pointer}.channel-list{display:grid;gap:4px}.new-channel{font-size:10px;color:#ff9c94;cursor:pointer;border:0;background:transparent;margin:0 8px}@media(max-width:650px){.community-app{grid-template-columns:1fr}.community-side{display:none}.community-head{padding:15px}.message-list{padding:18px}.message-form{padding:12px}}</style></head><body><main class="community-app"><aside class="community-side"><a href="index.html"><img class="community-logo" src="assets/emberfans-logo.png" alt="EmberFans" /></a><h2>YOUR COMMUNITIES</h2><div id="communityList" class="community-list"></div><button class="side-action" id="createCommunity" hidden>Create community</button><h2 id="channelHeading" hidden>CHANNELS</h2><div id="channelList" class="channel-list"></div><button class="new-channel" id="createChannel" hidden>+ Add channel</button></aside><section class="community-main"><header class="community-head"><div><h1 id="channelTitle">Communities</h1><p id="channelSubtitle">Choose a community to start chatting.</p></div><a class="secondary-button" href="index.html">Dashboard</a></header><div class="message-list" id="messageList"><p class="empty">Loading your communities...</p></div><form class="message-form" id="messageForm" hidden><input id="messageInput" maxlength="2000" placeholder="Message this channel" autocomplete="off" /><button>Send</button></form></section></main><script src="community.js"></script></body></html>
